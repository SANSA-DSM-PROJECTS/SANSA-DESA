# SANSA DESA login theme
# parent=keycloak gives a fallback for every page not customised here
# (logout confirm, OTP, page expired, etc.) and the base message bundle.
parent=keycloak
import=common/keycloak

# Use the theme's own Bootstrap styling instead of Keycloak's PatternFly CSS.
stylesCommon=
styles=css/bootstrap.min.css css/style.css
