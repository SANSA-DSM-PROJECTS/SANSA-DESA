# =============================================================
# desadev-geoserver.sansa.org.za  ->  GeoServer (Value Added Products)
# =============================================================
# GeoServer runs outside this compose stack, on the SANSA network at
# 10.150.16.179:8080 over plain HTTP. TerriaMap is served over HTTPS, and
# browsers block mixed (HTTP) content on an HTTPS page — so the catalog must
# reach GeoServer through this TLS front-end rather than by raw IP.
#
# NOTE: GeoServer advertises its own internal URL inside GetCapabilities
# (<OnlineResource xlink:href="http://10.150.16.179:8080/geoserver/...">).
# Clients that follow those advertised URLs would drop back to HTTP and be
# blocked again, so the response body is rewritten below. The cleaner
# long-term fix is to set GeoServer's own "Proxy Base URL" global setting to
# https://desadev-geoserver.sansa.org.za/geoserver and drop the sub_filter.
# =============================================================
server {
    listen 443 ssl;
    server_name desa-geoserver.sansa.org.za;

    ssl_certificate         /etc/nginx/ssl/sansa.org.za.crt;
    ssl_certificate_key     /etc/nginx/ssl/sansa.org.za.key;
    ssl_trusted_certificate /etc/nginx/ssl/CA_Bundle.txt;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    location /geoserver {
        proxy_pass http://10.150.16.179:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable upstream compression so sub_filter can rewrite the body.
        proxy_set_header Accept-Encoding "";

        # Rewrite advertised URLs to the public HTTPS endpoint.
        #
        # GeoServer builds OnlineResource/GetLegendGraphic URLs from the Host
        # header, so it already emits desadev-geoserver.sansa.org.za — but with
        # an http:// scheme, because it does not honour X-Forwarded-Proto
        # without Tomcat's RemoteIpValve. Left as-is those URLs are mixed
        # content and the browser blocks them, so force the scheme to https.
        # The raw-IP rule covers any URL GeoServer emits from its configured
        # Proxy Base URL rather than from the Host header.
        sub_filter_types application/xml text/xml application/vnd.ogc.wms_xml application/json;
        sub_filter_once off;
        sub_filter "http://desadev-geoserver.sansa.org.za" "https://desadev-geoserver.sansa.org.za";
        sub_filter "http://10.150.16.179:8080/geoserver" "https://desadev-geoserver.sansa.org.za/geoserver";

        # CORS — TerriaMap is served from a different subdomain.
        #
        # Drop any CORS header GeoServer itself emits first: if its own CORS
        # filter is on, nginx would *append* a second Access-Control-Allow-Origin
        # and browsers reject the "*, *" duplicate as invalid.
        proxy_hide_header Access-Control-Allow-Origin;

        # Answer CORS preflight (OPTIONS) directly, without hitting GeoServer.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age       "1728000" always;   # cache preflight 20 days
            add_header Content-Type                 "text/plain; charset=utf-8";
            add_header Content-Length               0;
            return 204;
        }

        # CORS headers on the actual GET/POST responses.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With" always;
        # Re-declare HSTS: add_header here overrides the server-level one, so
        # without this the location would silently drop HSTS on GeoServer paths.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_read_timeout 120s;
    }
}
