# ---------- HTTP -> HTTPS redirect for all six names ----------
server {
    listen 80;
    server_name desa.sansa.org.za
                desa-explorer.sansa.org.za
                desa-map.sansa.org.za
                desa-hub.sansa.org.za
                desa-ows.sansa.org.za
                desa-geoserver.sansa.org.za;

    return 301 https://$host$request_uri;
}

# =============================================================
# desa.sansa.org.za  ->  DESA UI
# =============================================================
server {
    listen 443 ssl;
    server_name desa.sansa.org.za;
    client_max_body_size 100M;

    # -------- Document root (DESA UI) --------
    root /var/www;
    index index.html;

    ssl_certificate         /etc/nginx/ssl/sansa.org.za.crt;
    ssl_certificate_key     /etc/nginx/ssl/sansa.org.za.key;
    ssl_trusted_certificate /etc/nginx/ssl/CA_Bundle.txt;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    
    # -------- Compression --------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;


    # -------- Deny hidden and sensitive files --------
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(composer\.(json|lock)|vendor/) { deny all; }

    # =========================================================
    # DESA UI (static frontend under /var/www)
    # =========================================================

    # Cache DESA UI static assets (scoped to /assets/ so proxied
    # apps like Explorer / Jupyter / Terria are unaffected)
    location ~* ^/assets/.+\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frontend routing: try file, then file.html, then dir, else 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }


    # DESA Contact Form API
    location /api/contact {
      proxy_pass http://desa-contact:8000/api/contact;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
}

    # Health check
    location /health {
        default_type text/plain;
        return 200 'DESA System Operational';
    }
}

