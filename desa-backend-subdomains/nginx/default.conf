# =============================
# Redirect all HTTP requests to HTTPS
# =============================
server {
    listen 80;
    server_name airquality.sansa.org.za watermanagement.sansa.org.za disasters-flood.sansa.org.za;
    return 301 https://$host$request_uri;
}


# =================================
# Airquality server configuration    
# =================================

server {
    listen 443 ssl;
    server_name airquality.sansa.org.za;
    client_max_body_size 500M;
    proxy_read_timeout 300s;
    # SSL certificate configuration
    ssl_certificate /etc/nginx/ssl/sansa-certificate.txt;
    ssl_certificate_key /etc/nginx/ssl/sansa-private.txt;
    ssl_trusted_certificate /etc/nginx/ssl/sansa-bundle.txt;
    
    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (optional, but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

       # aqi-frontend route at /
    location / {
        proxy_pass http://airquality-frontend:5173/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    
    # aqi-tile-server
    location /api/ {
        proxy_pass http://tile-server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        return 200 'DESA System Operational';
        add_header Content-Type text/plain;
    }
}


# ====================================
# Watermanagement server configuration    
# ====================================

server {
    listen 443 ssl;
    server_name watermanagement.sansa.org.za;
    client_max_body_size 300M;
    
    # SSL certificate configuration
    ssl_certificate /etc/nginx/ssl/sansa-certificate.txt;
    ssl_certificate_key /etc/nginx/ssl/sansa-private.txt;
    ssl_trusted_certificate /etc/nginx/ssl/sansa-bundle.txt;

    
    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security  HSTS (optional, but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
  

    location / {
        proxy_pass http://water-frontend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for development live-reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /external-api/ {
        proxy_pass http://10.150.16.133:8889/api/;
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle CORS
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Allow large file uploads
        client_max_body_size 100M;
        
        proxy_redirect off;
    }

    # Media files from external API (GeoTIFF files, etc.)
    location /media/ {
        proxy_pass http://10.150.16.133:8889/media/;
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle CORS
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        
        # Timeouts for large file downloads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffer settings for large files
        proxy_buffering off;
        proxy_request_buffering off;
        
        proxy_redirect off;
    }

        # External API Backend (proxied to avoid mixed content issues)
    location /geoserver/ {
        proxy_pass http://10.150.16.133:8084/geoserver/;
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for GeoServer - add these headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Fix redirects to work with the proxy path
        proxy_redirect http://10.150.16.133:8084/geoserver/ https://$host/geoserver/;
        proxy_redirect http://10.150.16.133:8084/ https://$host/geoserver/;
        
        # Cookie path rewriting (important for session management)
        proxy_cookie_path /geoserver /geoserver;
        proxy_cookie_domain 10.150.16.133 $host;
        
        # Handle CORS
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Allow large file uploads
        client_max_body_size 100M;
        
        #proxy_redirect off;
    }

    location /minio/ {
        proxy_pass http://10.150.16.133:9000/;
        
        # Forward headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle CORS
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        
        # Timeouts for large file downloads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffer settings for large files
        proxy_buffering off;
        proxy_request_buffering off;
        
        proxy_redirect off;
    }



    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Health check endpoint
    location /health {
        return 200 'DESA System Operational';
        add_header Content-Type text/plain;
    }
}


# =====================================
# Disaster-floods server configuration    
# =====================================

upstream floods_api {
    server uiengine:3001;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name disasters-flood.sansa.org.za;
    #client_max_body_size 100M;
    
    # SSL certificate configuration
    ssl_certificate /etc/nginx/ssl/sansa-certificate.txt;
    ssl_certificate_key /etc/nginx/ssl/sansa-private.txt;
    ssl_trusted_certificate /etc/nginx/ssl/sansa-bundle.txt;

        
    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
        
    # Security  HSTS (optional, but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SLD_BODY can be huge for AOI clipping — bump header buffers
    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;
        
        # Serve frontend static files
      location / {
        root /usr/share/nginx/html/static/floods;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        }
    
    }
            

        # Proxy API requests to the uiengine service (match Vite dev proxy)
    location /api {
        proxy_pass http://floods_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Match Vite dev proxy behavior - extended timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Increase proxy buffer sizes for large SLD_BODY parameters
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

        # Proxy OWS requests with path rewrite (match Vite dev proxy exactly)
    location /ows {
        # Rewrite /ows to /api/ows to match Vite dev proxy behavior
        rewrite ^/ows(.*)$ /api/ows$1 break;

        proxy_pass http://floods_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Extended timeout for GeoServer operations (match Vite dev proxy)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # Buffer settings for large responses (maps, data)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /geoserver {
        proxy_pass https://10.150.16.184;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;

        # Match Vite dev proxy behavior
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

        # Health check endpoint (bypass proxy)
        location /health {
            proxy_pass http://floods_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Quick timeout for health checks
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }
        
        # Redirect server error pages to the static page
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
